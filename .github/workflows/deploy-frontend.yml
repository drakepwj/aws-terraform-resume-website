name: Deploy Frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - frontend/resume.html
      - frontend/style.css
  workflow_dispatch:

# Keyless AWS auth: the job assumes an IAM role through GitHub's OIDC provider (see ci.tf).
permissions:
  id-token: write
  contents: read

env:
  AWS_S3_BUCKET: resume-drakepwj.dev
  AWS_REGION: us-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/ "s3://${AWS_S3_BUCKET}" \
            --exclude '*' --include 'resume.html' --include 'style.css'

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1V7QU4S9HRBDC \
            --paths "/*"
